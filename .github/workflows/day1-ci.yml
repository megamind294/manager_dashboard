name: Day 1 CI

on:
  push:
    branches:
      - 'feature/employee-management-day1'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: CI=true npm test -- --watchAll=false
      - name: Build
        run: npm run build
